<!DOCTYPE html>
<!-- HTML PAGE FOR THE TCA. DO NOT CHANGE THIS IN ANY WAY. -->
<html>
<head>
<title>FestiVault</title>
<style type='text/css'>
body {
    position: relative;
    font-family: sans-serif;
    margin: 0;
    padding: 0;
}
body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    height: 100%;
    width: 100%;
    background: url("festivault.png") no-repeat center center fixed;
    background-size: cover;
    opacity: 0.6;
    z-index: -1;
}
h1 {
    color: rgb(120, 0, 170);
}
p {
    font-weight: bold;
    color: rgb(255, 105, 180);
}
h2 {
    color: rgb(0, 0, 120);
}
h3 {
    color: rgb(255, 255, 0);
}
div.background {
    padding: 10px;
    border-radius: 5px;
    padding-left: 7rem;
}
</style>
</head>
<body>
<div class="background">
    <h1>FestiVault - Event Reservation</h1>
    <h2>Search for a festival:</h2>
    <p>
        Title:
        <input id='festivalTitle' />
        Organizer:
        <input id='festivalOrganizer' />
        <input type='button' id='searchFestivalButton' value='Search!' />
    </p>
    <div id='searchResults'></div>

    <h2>Add a festival:</h2>
    <p>
        Title:<br />
        <input id='newFestivalTitle' /><br />
        Organizer:<br />
        <input id='newFestivalOrganizer' /><br />
        Category: <br />
        <input id='newFestivalCategory' /><br />
        Available:<br />
        <input id='newFestivalAvailable' type='checkbox' /><br />
        <input type='button' id='addFestivalButton' value='Add!' />
    </p>
    <div id='festivalAddStatus'></div>

    <h3 style="color:black">Login:</h3>
    <p>
        Username:
        <input id='loginUsername' />
        Password:
        <input id='loginPassword' type='password' />
        <input type='button' id='loginButton' value='Login!' />
    </p>
    <div id='loginStatus'></div>
</div>
<script type='module' src='client.mjs'></script>
</body>
</html>
